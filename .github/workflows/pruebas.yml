name: Pruebas Automatizadas (Java, Postman, Playwright)

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  ejecutar-pruebas:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: 1234
          MYSQL_DATABASE: softdentist
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -p1234"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Preparar Base de Datos MySQL
        run: mysql -h 127.0.0.1 -P 3306 -u root -p1234 softdentist < softdentist.sql

      - name: 🚨 Introducir BUG INTENCIONAL en el Sistema 🚨
        run: |
          # =========================================================================
          # DEMOSTRACIÓN DE QA: Simulamos que un desarrollador guardó accidentalmente 
          # una credencial de base de datos incorrecta en el código fuente.
          # El sistema compilará y Tomcat arrancará, pero cuando Postman intente 
          # usar la app, arrojará un error 500 Interno ¡y el pipeline se pondrá ROJO!
          #
          # 🟢 PARA ARREGLARLO EN LA DEMO: Ponle un '#' a la línea 'sed' de abajo.
          # =========================================================================
          #sed -i 's/1234/contrasena_bug/g' persistencia/src/main/resources/META-INF/persistence.xml

      - name: Compilar proyecto con Maven
        run: mvn clean package -DskipTests

      - name: Arrancar servidor Tomcat 11 (Compatible con jakarta)
        run: |
          # Usamos Tomcat 11 fresco para soportar tu codigo moderno de Jakarta EE
          wget https://archive.apache.org/dist/tomcat/tomcat-11/v11.0.8/bin/apache-tomcat-11.0.8.tar.gz
          tar -xzf apache-tomcat-11.0.8.tar.gz
          chmod +x apache-tomcat-11.0.8/bin/*.sh
          cp Vista/target/*.war apache-tomcat-11.0.8/webapps/vista.war
          ./apache-tomcat-11.0.8/bin/startup.sh
          sleep 25

      - name: Mostrar Logs de Tomcat (Para depuración)
        run: cat apache-tomcat-11.0.8/logs/catalina.out || true

      # --- POSTMAN ---
      - name: Configurar Node.js (Para Postman)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar Newman
        run: npm install -g newman

      - name: Ejecutar pruebas de API (Postman)
        run: newman run .github/postman/Proyecto_Finalpostman_collection.json

      # --- PLAYWRIGHT (PYTHON) ---
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias de Playwright (Python)
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-playwright pytest-html
          playwright install --with-deps

      - name: Ejecutar pruebas UI (Playwright Python)
        run: pytest .github/playwritght/test_login_ui.py --html=reporte-playwright/index.html

      - name: Guardar reporte de Playwright
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reporte-playwright-html
          path: reporte-playwright/
          retention-days: 7