name: Pruebas Automatizadas (Java, Postman, Playwright)

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  ejecutar-pruebas:
    runs-on: ubuntu-latest

    # 1. Levantamos MySQL con la contraseña '1234' para que coincida con tu persistence.xml
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: 1234
          MYSQL_DATABASE: softdentist
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -p1234"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      # 2. Cargar el script SQL a la base de datos usando la contraseña 1234
      - name: Preparar Base de Datos MySQL
        run: mysql -h 127.0.0.1 -P 3306 -u root -p1234 softdentist < softdentist.sql

      # 3. Compilar el proyecto Java
      - name: Compilar proyecto con Maven
        run: mvn clean package -DskipTests

      # 4. Arrancar servidor Tomcat y esperar a que despliegue la app
      - name: Arrancar servidor Tomcat
        run: |
          chmod +x apache-tomcat-11.0.8/bin/*.sh
          cp Vista/target/*.war apache-tomcat-11.0.8/webapps/vista.war
          ls -la apache-tomcat-11.0.8/webapps/
          ./apache-tomcat-11.0.8/bin/startup.sh
          sleep 25 # Damos 25 segundos a que Tomcat despliegue la app completa

      - name: Mostrar Logs de Tomcat (Para depuración)
        run: cat apache-tomcat-11.0.8/logs/catalina.out || true

      # 5. Configurar herramientas de testing
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar Newman (Postman CLI)
        run: npm install -g newman

      # 6. Ejecutar Postman (RUTA CORREGIDA)
      - name: Ejecutar pruebas de API (Postman)
        run: newman run .github/postman/Proyecto_Finalpostman_collection.json
        continue-on-error: true

      # --- PLAYWRIGHT ---
      - name: Instalar Playwright
        run: |
          mkdir -p pruebas/playwright
          cd pruebas/playwright
          npm init -y
          npm install -D @playwright/test
          npx playwright install --with-deps

      - name: Ejecutar pruebas UI (Playwright)
        run: |
          cd pruebas/playwright
          npx playwright test
        continue-on-error: true

      - name: Guardar reporte de Playwright
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reporte-playwright
          path: playwright-report/
          retention-days: 7