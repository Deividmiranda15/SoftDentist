name: Pruebas Automatizadas (Java, Postman, Playwright)

# Se ejecuta al hacer push a la rama o creas un Pull Request
on:
  push:
    branches: [ "**" ] # Se ejecuta en cualquier rama temporalmente
  pull_request:
    branches: [ "main", "master" ]

jobs:
  ejecutar-pruebas:
    runs-on: ubuntu-latest

    steps:
      # 1. Descargar el código
      - name: Checkout del código
        uses: actions/checkout@v4

      # 2. Configurar Java
      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      # 3. Compilar el proyecto Java
      - name: Compilar proyecto con Maven
        run: mvn clean install -DskipTests

      # 4. Configurar Node.js (Para Postman y Playwright)
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # --- POSTMAN ---
      - name: Instalar Newman (Postman CLI)
        run: npm install -g newman

      # NOTA: Cambia la ruta al archivo JSON real cuando tu equipo te lo pase
      - name: Ejecutar pruebas de API (Postman)
        run: newman run pruebas/postman/coleccion.json
        continue-on-error: true # Continúa aunque falle, para ver el resto

      # --- PLAYWRIGHT ---
      - name: Instalar Playwright
        run: |
          npm init -y
          npm install -D @playwright/test
          npx playwright install --with-deps

      # NOTA: Esto asume que los archivos de playwright están en la raíz o configurados
      - name: Ejecutar pruebas UI (Playwright)
        run: npx playwright test
        continue-on-error: true

      # Subir reporte visual de Playwright
      - name: Guardar reporte de Playwright
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reporte-playwright
          path: playwright-report/
          retention-days: 7