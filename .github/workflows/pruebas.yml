name: Pruebas Automatizadas (Java, Postman, Playwright)

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  ejecutar-pruebas:
    runs-on: ubuntu-latest

    # 1. Levantamos un contenedor con MySQL para simular tu base de datos local
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: softdentist
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      # 2. Cargar el archivo .sql a la base de datos MySQL recién creada
      - name: Preparar Base de Datos MySQL
        run: mysql -h 127.0.0.1 -P 3306 -u root -proot softdentist < softdentist.sql

      # 3. Compilamos el código Java a un archivo WAR
      - name: Compilar proyecto con Maven
        run: mvn clean package -DskipTests

      # 4. Dar permisos, copiar el WAR compilado a Tomcat y arrancarlo
      - name: Arrancar servidor Tomcat
        run: |
          chmod +x apache-tomcat-11.0.8/bin/*.sh
          cp Vista/target/*.war apache-tomcat-11.0.8/webapps/vista.war
          ./apache-tomcat-11.0.8/bin/startup.sh
          sleep 20 # Esperamos 20 segundos a que Tomcat termine de encender

      # 5. Configurar Node.js y Postman
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar Newman (Postman CLI)
        run: npm install -g newman

      # 6. ¡AQUI SE EJECUTA TU ARCHIVO DE POSTMAN REAL!
      - name: Ejecutar pruebas de API (Postman)
        run: newman run pruebas/postman/Proyecto_Finalpostman_collection.json
        continue-on-error: true

      # --- PLAYWRIGHT (Se queda preparado para cuando te pasen esos archivos) ---
      - name: Instalar Playwright
        run: |
          npm init -y
          npm install -D @playwright/test
          npx playwright install --with-deps

      - name: Ejecutar pruebas UI (Playwright)
        run: npx playwright test
        continue-on-error: true

      - name: Guardar reporte de Playwright
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reporte-playwright
          path: playwright-report/
          retention-days: 7